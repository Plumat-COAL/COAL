name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # Actions > CI > Run workflow: also builds the Windows app for the chosen branch

permissions:
  contents: read

jobs:
  python:
    # The engine on its own first (no app, no extras: what pipelines install), then the app without extras on top: the
    # GUI and MCP tests skip here; the gui / mcp jobs below run them.
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # 3.14 changed multiprocessing's default start method on Linux to forkserver (the worker tests cover it);
          # Linux only, to keep the matrix small
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip  # keyed on the files that pin dependencies
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install the engine (coal-align only)
        run: python -m pip install -e .
      - name: The engine installs no app
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('coal_app') is not None)"
      # psutil is for the tests only (tests/test_robustness.py watches coal's worker processes); the package itself
      # does not depend on it
      - name: Install the test-only dependencies
        run: python -m pip install psutil
      - name: Engine tests
        run: python .github/ci_unittest.py discover -s tests
      - name: Install the app (coal-align-app, no extras)
        run: python -m pip install -e apps/coal-app
      - name: App tests
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python .github/ci_unittest.py discover -s apps/coal-app/tests
      # Runs even after a failed earlier step (the implicit success() would skip it whenever App tests fail).
      # The job still fails if any test step failed.
      - name: Desktop wrapper tests
        if: ${{ !cancelled() && matrix.os != 'macos-latest' }}
        working-directory: apps/coal-app/desktop
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python ../../../.github/ci_unittest.py test_wrapper test_smoke  # failures also appear as readable annotations

  # One job per extra, each in its own environment, with COAL_REQUIRE_EXTRAS making the tests fail instead of skip.
  gui:
    name: GUI extra (apps/coal-app[gui], real Gradio) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install the engine and the app with the gui extra
        run: python -m pip install -e . -e "apps/coal-app[gui]"
      - name: Dependency check
        run: python -m pip check
      - name: App tests (GUI tests required)
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          COAL_REQUIRE_EXTRAS: gui
        run: python .github/ci_unittest.py discover -s apps/coal-app/tests
      # The repository checks in tests/ (website, release workflows) read the workflows with PyYAML, which comes with
      # Gradio: here they must run, not skip.
      - name: Docs and site tests (PyYAML required)
        env:
          COAL_REQUIRE_EXTRAS: gui
        run: python .github/ci_unittest.py discover -s tests -p "test_docs_*.py"

  pal2nal-fuzz:
    # Differential fuzz against the real PAL2NAL v14 on every push: fetched by
    # scripts/fetch_pal2nal.py (official site, else the orthologr copy on GitHub; sha256-checked; PAL2NAL/ is
    # git-ignored and never committed), then tests/fuzz_vs_pal2nal.py (FUZZ_N random cases x 4 output formats,
    # fixed seed). Fails if the fuzz is skipped.
    name: "Differential fuzz vs the real PAL2NAL v14"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install COAL
        run: python -m pip install -e .
      - name: Fetch PAL2NAL v14 (checksum-verified, not committed)
        run: python scripts/fetch_pal2nal.py
      - name: Fuzz COAL against PAL2NAL (must not skip)
        env:
          PAL2NAL: PAL2NAL/pal2nal.v14/pal2nal.pl
          FUZZ_N: "3000"
        shell: bash
        run: |
          perl -e 'print "perl $^V\n"'
          python tests/fuzz_vs_pal2nal.py -v 2>&1 | tee fuzz.txt
          status=${PIPESTATUS[0]}
          grep -E "^(fuzz vs PAL2NAL|deliberate differences|cases exercising)" fuzz.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
          if grep -qiE "skipped" fuzz.txt; then
            echo "::error::the PAL2NAL fuzz was skipped (PAL2NAL not found)"; exit 1
          fi

  explainer:
    # Runs tests/test_docs_explainer.py (site/explainer.html in Chromium).
    name: "Explainer page in Chromium (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      # The Chromium download is cached (key: the pinned Playwright version)
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/pw-browsers
          key: playwright-1.48.0-chromium-${{ runner.os }}
      - name: Install the engine and Playwright with Chromium
        run: |
          python -m pip install -e . playwright==1.48.0
          python -m playwright install chromium        # skipped when the cache above restored it
      # The system libraries come from apt, which is what stalled this job twice (15 min, no output); a bounded
      # step with one retry turns a slow mirror into a visible failure instead of a cancelled job.
      # Best effort: the runner image already has nearly all of them, and the test step fails loudly ("must not
      # skip") if Chromium cannot start, so a slow apt mirror cannot cancel the whole job.
      - name: Chromium's system libraries
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            python -m playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt); retrying in 20 s"; sleep 20
          done
          exit 1
      - name: Explainer tests (must not skip)
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_docs_explainer.py" -v 2>&1 | tee explainer.txt
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qiE "skipped" explainer.txt; then
            echo "::error::explainer tests were skipped (Chromium not found)"; exit 1
          fi

  mcp:
    name: MCP extra (apps/coal-app[mcp], stdio server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install the engine and the app with the mcp extra
        run: python -m pip install -e . -e "apps/coal-app[mcp]"
      - name: Dependency check
        run: python -m pip check
      - name: App tests (MCP tests required)
        env:
          COAL_REQUIRE_EXTRAS: mcp
        run: python .github/ci_unittest.py discover -s apps/coal-app/tests

  extras-together:
    # Informational: can the app's [gui] and [mcp] extras share one environment? (gradio[mcp] 5.x may need mcp 1.x while the
    # mcp extra pins 2.2.0.) Never fails the build; read the job summary.
    name: "Info: gui + mcp extras in one environment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Resolve both extras together
        shell: bash
        run: |
          if python -m pip install --dry-run -e . -e "apps/coal-app[gui,mcp]" > resolve.txt 2>&1; then
            echo "gui + mcp extras resolve together." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gui + mcp extras CONFLICT: install them in separate environments." >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 resolve.txt >> "$GITHUB_STEP_SUMMARY"
          fi

  cpp:
    # Builds the C++ engine (its CMakeLists.txt is at the repository root) on all three systems with
    # warnings as errors and runs every C++ test (goldens with COAL_IMPL=cpp, C++ vs Python, CLI, readers, tables,
    # thread pool); a skipped test fails the job, except tests.test_cpp_cli's live comparison with the Python CLI, which
    # depends on argparse's exact messages (Python 3.13's; it runs here on 3.13 and skips on interpreters whose
    # argparse differs), and the platform skips (Linux-only peak-memory test, POSIX signals/pipes on Windows).
    # "not built" skips still fail.
    name: C++ engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON
          # Compiler diagnostics as annotations: they are readable from the checks API, the raw log is not always.
          if ! cmake --build build --config Release -j 2 2>&1 | tee build.log; then
            grep -iE "error|warning" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Require the binary and its comparison tests
        shell: bash
        run: |
          # Not `ls a b | head | grep -q .`: that always fails under bash -eo pipefail (ls exits 2 when one of the
          # two paths is missing). tests/test_repo_ci.py runs this script.
          [ -x build/coal-cpp ] || [ -f build/Release/coal-cpp.exe ] \
            || { echo "::error::no build/coal-cpp binary was built"; exit 1; }
          test -f tests/test_cpp_vs_python.py \
            || { echo "::error::tests/test_cpp_vs_python.py (C++ vs Python comparison) is missing"; exit 1; }
      - name: Point the tests at the binary
        shell: bash
        run: |
          if [ -f build/Release/coal-cpp.exe ]; then b="$PWD/build/Release/coal-cpp.exe"; else b="$PWD/build/coal-cpp"; fi
          echo "COAL_CPP_BIN=$b" >> "$GITHUB_ENV"
      - name: Install the engine (and build + wheel, for tests/test_wheels.py)
        run: python -m pip install -e . build wheel
      - name: C++ tests (must not skip)
        # tests.test_wheels: the platform wheel with this coal-cpp inside installs and `coal` runs it
        shell: bash
        env:
          COAL_IMPL: cpp
        run: |
          # Not `... | tee f` + PIPESTATUS: under the runner's `bash -eo pipefail` a failing pipeline ends the script
          # right there, before any diagnostics below run.
          status=0
          python -m unittest -v tests.test_differential tests.test_cpp_vs_python tests.test_cpp_cli \
            tests.test_cpp_readers tests.test_cpp_tables tests.test_cpp_pool tests.test_wheels > cpp_tests.txt 2>&1 || status=$?
          cat cpp_tests.txt
          if [ "$status" -ne 0 ]; then
            # The raw log is not always readable from the checks API: name the failed tests as annotations
            grep -E "^(FAIL|ERROR):|Error:|^Ran |^FAILED" cpp_tests.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 cpp_tests.txt | while IFS= read -r line; do echo "::warning::$line"; done
            exit "$status"
          fi
          if grep -iE "\.\.\. skipped" cpp_tests.txt | grep -viqE "live comparison needs Python|peak memory read with getrusage|POSIX"; then
            echo "::error::C++ tests were skipped, so the C++ engine was not fully exercised"; exit 1
          fi
      # DIAMOND for the pipeline's default route (reciprocal best hits, the DIAMOND alignment, DeepClust), with COAL's
      # own installer: the pinned release from DIAMOND's GitHub releases, unpacked only after its SHA-256 matched the
      # one in src/coal/dnds_pipeline.py. On all three systems: Linux and Windows have a pre-compiled binary each,
      # and DIAMOND's macOS archive (the same pinned file for both architectures) holds one universal binary with
      # an x86_64 slice (macOS 10.15+) and an arm64 slice (macOS 11+, code-signed) that link only /usr/lib libraries, so
      # it runs natively on the arm64 macos-latest runner, without Rosetta (checked on the archive of 2.2.8,
      # 2026-11-13; docs/pipeline.md). Written to GITHUB_ENV by Python with \n line ends (a path through bash on
      # Windows would carry a \r).
      - name: Install DIAMOND (pinned release, SHA-256 verified by coal)
        run: python -c "import os; from coal import dnds_pipeline as P; p = P.install_diamond(method='official'); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n').write('COAL_DIAMOND=' + p + '\nCOAL_TEST_DIAMOND=' + p + '\nCOAL_REQUIRE_DIAMOND=1\n')"
      # Clustal Omega and MAFFT for cluster mode's MSA route, with COAL's own installer (Bioconda through the pinned
      # micromamba, into COAL's cache, where the tests find them). Linux only: one system is enough to run those
      # tests, and there is no install for Windows (docs/alignment.md). Best effort: if the channel cannot be
      # reached the step says so and the MSA tests skip, as they do on Windows and macOS.
      - name: Install Clustal Omega and MAFFT (Bioconda, by coal; Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: |
          python -m coal pipeline install clustalo mafft \
            || { echo "::warning::Clustal Omega / MAFFT were not installed: the MSA tests of this job will skip"; exit 1; }
      - name: Ka/Ks engine, alignment layer and pipeline tests (coal-cpp and coal-cpp-align required)
        # Biopython, EMBOSS needle, Clustal Omega and MAFFT are optional here (their live checks skip; the stored
        # Biopython / needle optima in tests/fixtures/align are always checked); coal-cpp and coal-cpp-align are
        # not (COAL_REQUIRE_CPP, COAL_REQUIRE_ALIGN: a missing binary fails), nor is DIAMOND where the step above
        # installed it (COAL_REQUIRE_DIAMOND). tests.test_kaks: the Ka/Ks engine against the KaKs_Calculator and
        # PAML goldens, which needs the binary and so skips in the Python jobs. tests.test_kaks_comeron_li: the
        # methods Comeron and Li against the stored references of gestimator and seqinr::kaks.
        # tests.test_short_options: attached option values in the small command lines. tests.test_output_lock:
        # the C++ engine's -o lock (race loop, Python and C++ honouring each other's locks).
        shell: bash
        env:
          COAL_REQUIRE_ALIGN: "1"
          COAL_REQUIRE_CPP: "1"
        run: |
          python -m unittest -v tests.test_kaks tests.test_kaks_comeron_li tests.test_align tests.test_msa \
            tests.test_dnds_pipeline tests.test_short_options tests.test_output_lock
      # The release's Linux wheels are built inside the manylinux_2_28 container (GCC 14, -Werror): build there on
      # every change too, so a warning that only that compiler raises fails CI, not the release (v0.5.0rc1 did).
      - name: Build inside the manylinux_2_28 container, as the release does (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux_2_28_x86_64 \
            bash packaging/wheels/build_linux_binary.sh /io /io/build-manylinux
          sudo chown -R "$(id -u):$(id -g)" build-manylinux
          ./build-manylinux/coal-cpp --version
          ./build-manylinux/coal-cpp-align --version
          # and the wheel step of the release, auditwheel check included (v0.5.0rc2 failed there)
          python -m pip install auditwheel==6.4.2
          python -m build --wheel -o dist-ci .
          python packaging/wheels/build_platform_wheel.py --binary build-manylinux/coal-cpp \
            --align-binary build-manylinux/coal-cpp-align \
            --wheel dist-ci/coal_align-*-py3-none-any.whl --platform-tag manylinux_2_28_x86_64 --outdir wheelhouse-ci --audit
          # the wheel in a fresh environment: both binaries are the wheel's, one alignment, one pipeline run
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --quiet wheelhouse-ci/coal_align-*-manylinux_2_28_x86_64.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" packaging/wheels/check_wheel_binaries.py
      # The library as an outside program uses it: install to a prefix, build examples/cpp-embed with
      # find_package(coal CONFIG), run it and check its codon alignment.
      - name: Install and build the embedding example (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/coal-prefix"
          test -f "$RUNNER_TEMP/coal-prefix/include/coal/core.hpp"
          test -x "$RUNNER_TEMP/coal-prefix/bin/coal-cpp"
          e="$RUNNER_TEMP/build-embed"
          cmake -S examples/cpp-embed -B "$e" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/coal-prefix" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build "$e" -j 2
          printf '>human\nATGAAAGTT---GCTCTG\n>mouse\nATGAAGGTCTCAGCACTA\n' > "$e/want.txt"
          "$e/coal-embed-example" > "$e/got.txt"
          diff "$e/want.txt" "$e/got.txt"

  # Builds the packaged Windows app (PyInstaller + Inno Setup, apps\coal-app\desktop\build.ps1) on every push to main,
  # so a broken pin is caught before a release (release.yml builds it only after a tag), and keeps the installer as a
  # workflow artifact for testing. Run it on any branch with "Run workflow" (workflow_dispatch).
  windows-app:
    name: Windows app build (installer + portable)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install Inno Setup (pinned, as release.yml)
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup installed, but $iscc is missing" }
      - name: Build the C++ engine (bundled into the app; SHIP-19)
        run: |
          # build-app, not build/ or cpp/build: the tests in build.ps1 look in those (demo/race.py picked a .lib there)
          cmake -S . -B build-app -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build-app --config Release -j 2
          if (-not (Test-Path build-app\Release\coal-cpp.exe)) { throw "no build-app\Release\coal-cpp.exe" }
      - name: Create the build venv
        run: python -m venv apps\coal-app\desktop\.venv
      - name: Build (apps\coal-app\desktop\build.ps1)
        timeout-minutes: 75
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\coal-app\desktop\build.ps1
      - name: Installer was made
        run: |
          $s = Get-ChildItem apps\coal-app\desktop\dist\COAL-Setup-*.exe
          if (-not $s) { throw "apps\coal-app\desktop\build.ps1 made no installer" }
          if (-not (Test-Path apps\coal-app\desktop\dist\COAL\_internal\coal-cpp.exe)) { throw "the C++ engine is not in the app" }
          $s | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coal-windows-ci
          path: apps/coal-app/desktop/dist/COAL-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
