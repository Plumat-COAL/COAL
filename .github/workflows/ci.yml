name: CI

on:
  push:
  pull_request:

# CHANGED(FIN-A10): new; was the default token permissions. See overnight/integration/CHANGES.md
permissions:
  contents: read

jobs:
  python:
    # Core install only (no extras): the GUI and MCP tests skip here; the gui / mcp jobs below run them.
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: ${{ matrix.python }}
      - name: Install COAL
        run: python -m pip install -e .
      - name: Engine tests
        run: python .github/ci_unittest.py discover -s tests  # CHANGED(FINAL-3)
      - name: App tests
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python .github/ci_unittest.py discover -s tests_app  # CHANGED(FINAL-3)
      # CHANGED(R2-D11): new; desktop/test_wrapper.py and test_smoke.py never ran in CI. Required on Linux; on
      # Windows they run for the first time here, so they may not fail the build until a run is green there
      # (then remove continue-on-error). See overnight/integration/CHANGES.md
      # CHANGED(R3-D2): was `if: matrix.os != 'macos-latest'` (implicit success(), so skipped whenever App tests
      # failed); now also runs after a failed earlier step. The job still fails if any test step failed.
      # See overnight/integration/CHANGES.md
      - name: Desktop wrapper tests
        # CHANGED(FINAL-1): was continue-on-error on Windows (never run there); green on windows-latest in run 39006043852, so now required.
        if: ${{ !cancelled() && matrix.os != 'macos-latest' }}
        working-directory: desktop
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python ../.github/ci_unittest.py test_wrapper test_smoke  # CHANGED(FINAL-3): was python -m unittest; failures now also appear as readable annotations

  # CHANGED(APP-16/APP-C5): was no job installing the extras (GUI and MCP tests always skipped); now one job per
  # extra, each in its own environment, with COAL_REQUIRE_EXTRAS making the tests fail instead of skip.
  gui:
    # CHANGED(R2-D11): was ubuntu only; now also windows-latest (first run there: allowed to fail until green).
    name: GUI extra (.[gui], real Gradio) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # CHANGED(FINAL-1): was continue-on-error on windows-latest (never run there); green in run 39006043852, so now required.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Install COAL with the gui extra
        run: python -m pip install -e ".[gui]"
      - name: Dependency check
        run: python -m pip check
      - name: App tests (GUI tests required)
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          COAL_REQUIRE_EXTRAS: gui
        run: python .github/ci_unittest.py discover -s tests_app  # CHANGED(FINAL-3)

  pal2nal-fuzz:
    # CHANGED(DEC-4): new. Differential fuzz against the real PAL2NAL v14 on every push: fetched by
    # scripts/fetch_pal2nal.py (official site, else the orthologr copy on GitHub; sha256-checked; PAL2NAL/ is
    # git-ignored and never committed), then tests/fuzz_vs_pal2nal.py (FUZZ_N random cases x 4 output formats,
    # fixed seed). Fails if the fuzz is skipped. See overnight/integration/CHANGES.md
    name: "Differential fuzz vs the real PAL2NAL v14"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Install COAL
        run: python -m pip install -e .
      - name: Fetch PAL2NAL v14 (checksum-verified, not committed)
        run: python scripts/fetch_pal2nal.py
      - name: Fuzz COAL against PAL2NAL (must not skip)
        env:
          PAL2NAL: PAL2NAL/pal2nal.v14/pal2nal.pl
          FUZZ_N: "3000"
        shell: bash
        run: |
          perl -e 'print "perl $^V\n"'
          python tests/fuzz_vs_pal2nal.py -v 2>&1 | tee fuzz.txt
          status=${PIPESTATUS[0]}
          grep -E "^(fuzz vs PAL2NAL|deliberate differences|cases exercising)" fuzz.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
          if grep -qiE "skipped" fuzz.txt; then
            echo "::error::the PAL2NAL fuzz was skipped (PAL2NAL not found)"; exit 1
          fi

  explainer:
    # CHANGED(R2-D11): new; tests_app/test_explainer.py (pitch/explainer.html in Chromium) always skipped in CI.
    # CHANGED(R3-D2): was continue-on-error: true (first run); green in run 39001781214, so now required.
    # See overnight/integration/CHANGES.md
    name: "Explainer page in Chromium (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Install COAL and Playwright with Chromium
        run: |
          python -m pip install -e . playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Explainer tests (must not skip)
        shell: bash
        run: |
          python -m unittest discover -s tests_app -p "test_explainer.py" -v 2>&1 | tee explainer.txt
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qiE "skipped" explainer.txt; then
            echo "::error::explainer tests were skipped (Chromium not found)"; exit 1
          fi

  mcp:
    name: MCP extra (.[mcp], stdio server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Install COAL with the mcp extra
        run: python -m pip install -e ".[mcp]"
      - name: Dependency check
        run: python -m pip check
      - name: App tests (MCP tests required)
        env:
          COAL_REQUIRE_EXTRAS: mcp
        run: python .github/ci_unittest.py discover -s tests_app  # CHANGED(FINAL-3)

  extras-together:
    # Informational: can .[gui] and .[mcp] share one environment? (gradio[mcp] 5.x may need mcp 1.x while the
    # mcp extra pins 2.2.0.) Never fails the build; read the job summary.
    name: "Info: gui + mcp extras in one environment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Resolve both extras together
        shell: bash
        run: |
          if python -m pip install --dry-run -e ".[gui,mcp]" > resolve.txt 2>&1; then
            echo "gui + mcp extras resolve together." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gui + mcp extras CONFLICT: install them in separate environments." >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 resolve.txt >> "$GITHUB_STEP_SUMMARY"
          fi

  cpp:
    # CHANGED(SHIP-3): was a job that waited for a cpp/CMakeLists.txt: the C++ engine's CMakeLists.txt is at the
    # repository root, so this job never built or tested coal-cpp. Now it builds it on all three systems with
    # warnings as errors and runs every C++ test (goldens with COAL_IMPL=cpp, C++ vs Python, CLI, readers, tables,
    # thread pool); a skipped test fails the job, except tests.test_cpp_cli's live comparison with the Python CLI, which
    # depends on argparse's exact messages and runs only on older 3.10/3.11 builds (it is run by hand there).
    name: C++ engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (CHANGED(FIN-A10): was @v4)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (CHANGED(FIN-A10): was @v5)
        with:
          python-version: "3.13"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release -j 2
      - name: Require the binary and its comparison tests
        shell: bash
        run: |
          # CHANGED(R2-D4): was `ls a b | head | grep -q .`, which always failed under bash -eo pipefail (ls exits 2
          # when one of the two paths is missing); tests_app/test_ci_steps.py runs this script.
          [ -x build/coal-cpp ] || [ -f build/Release/coal-cpp.exe ] \
            || { echo "::error::no build/coal-cpp binary was built"; exit 1; }
          test -f tests/test_cpp_vs_python.py \
            || { echo "::error::tests/test_cpp_vs_python.py (C++ vs Python comparison) is missing"; exit 1; }
      - name: Point the tests at the binary
        shell: bash
        run: |
          if [ -f build/Release/coal-cpp.exe ]; then b="$PWD/build/Release/coal-cpp.exe"; else b="$PWD/build/coal-cpp"; fi
          echo "COAL_CPP_BIN=$b" >> "$GITHUB_ENV"
      - name: Install COAL
        run: python -m pip install -e .
      - name: C++ tests (must not skip)
        shell: bash
        env:
          COAL_IMPL: cpp
        run: |
          python -m unittest -v tests.test_differential tests.test_cpp_vs_python tests.test_cpp_cli \
            tests.test_cpp_readers tests.test_cpp_tables tests.test_cpp_pool 2>&1 | tee cpp_tests.txt
          test "${PIPESTATUS[0]}" -eq 0
          if grep -iE "\.\.\. skipped" cpp_tests.txt | grep -viq "live comparison needs Python"; then
            echo "::error::C++ tests were skipped, so the C++ engine was not fully exercised"; exit 1
          fi
