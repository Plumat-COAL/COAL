name: Nightly

# The test campaign that finds the bugs the per-push CI does not: a fresh random seed every night (the run number,
# or the `seed` input of a manual run), so the random comparisons keep covering new inputs. Six independent jobs:
#   pal2nal-fuzz   COAL vs the real PAL2NAL v14 (3,000 random cases x 4 formats), the Python engine and coal-cpp
#   engine-fuzz    coal-cpp vs the Python engine on tests/tools/engine_fuzz.py's wider input space (1,500 cases)
#   kaks-properties the Ka/Ks engine's property-based fuzz (tests/test_kaks_properties.py): COAL_SLOW unit tests and
#                  a 1,500-pair campaign (the reference fuzz, tests/fuzz_kaks_vs_reference.py, needs KaKs_Calculator
#                  and yn00 builds that CI does not have: run by hand, docs/kaks.md "Validation")
#   sanitizers     coal-cpp built with ASan + UBSan: the C++ test set, 300 generator cases and 300 Ka/Ks pairs
#   tsan           coal-cpp and coal-cpp-align built with ThreadSanitizer: kaks / dnds / codon-dnds -j 4 (all
#                  methods, Comeron and Li included) and the aligner, each also compared with its -j 1 output
#   tutorials      ci.yml's tutorials job (docs/tutorials run on their real NCBI data) without its paths filter
# A failing fuzz job uploads the differing cases as an artifact (each case folder holds its inputs and args.txt).
# How to read one and how to run each job locally: CONTRIBUTING.md, "Nightly checks".

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      seed:
        description: "Random seed for every fuzz (empty: this run's number)"
        required: false
        default: ""

# The seed is in the run's title, so the failing night's seed is one glance away.
run-name: "Nightly fuzz (seed ${{ inputs.seed || github.run_number }})"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  FUZZ_SEED: ${{ inputs.seed || github.run_number }}

jobs:
  pal2nal-fuzz:
    # As ci.yml's pal2nal-fuzz job (PAL2NAL fetched by scripts/fetch_pal2nal.py, sha256-checked, never committed),
    # with tonight's seed, once with the Python engine and once with coal-cpp (COAL_FUZZ_ENGINE=cpp). Both halves
    # run even if the first fails; the kept cases of either are uploaded.
    name: "Fuzz vs PAL2NAL v14 (Python engine and coal-cpp)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install COAL
        run: python -m pip install -e .
      - name: Fetch PAL2NAL v14 (checksum-verified, not committed)
        run: python scripts/fetch_pal2nal.py
      - name: Build coal-cpp
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release -j 2
          test -x build/coal-cpp
      - name: Fuzz the Python engine against PAL2NAL (must not skip)
        env:
          PAL2NAL: PAL2NAL/pal2nal.v14/pal2nal.pl
          FUZZ_N: "3000"
          FUZZ_KEEP: fuzz-keep/python
        shell: bash
        run: |
          perl -e 'print "perl $^V\n"'
          echo "seed $FUZZ_SEED, python engine"
          python tests/fuzz_vs_pal2nal.py -v 2>&1 | tee fuzz-python.txt
          status=${PIPESTATUS[0]}
          echo "### Python engine vs PAL2NAL, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(fuzz vs PAL2NAL|deliberate differences|cases exercising)" fuzz-python.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
          if grep -qiE "skipped" fuzz-python.txt; then
            echo "::error::the PAL2NAL fuzz was skipped (PAL2NAL not found)"; exit 1
          fi
      - name: Fuzz coal-cpp against PAL2NAL (must not skip)
        if: ${{ !cancelled() }}
        env:
          PAL2NAL: PAL2NAL/pal2nal.v14/pal2nal.pl
          FUZZ_N: "3000"
          FUZZ_KEEP: fuzz-keep/cpp
          COAL_FUZZ_ENGINE: cpp
          COAL_CPP_BIN: build/coal-cpp
        shell: bash
        run: |
          echo "seed $FUZZ_SEED, coal-cpp"
          python tests/fuzz_vs_pal2nal.py -v 2>&1 | tee fuzz-cpp.txt
          status=${PIPESTATUS[0]}
          echo "### coal-cpp vs PAL2NAL, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(fuzz vs PAL2NAL|deliberate differences|cases exercising)" fuzz-cpp.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
          if grep -qiE "skipped" fuzz-cpp.txt; then
            echo "::error::the PAL2NAL fuzz was skipped (PAL2NAL not found)"; exit 1
          fi
          grep -q "fuzz engine cpp" fuzz-cpp.txt || { echo "::error::the fuzz did not run coal-cpp"; exit 1; }
      - name: Upload the differing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pal2nal-fuzz-seed-${{ env.FUZZ_SEED }}
          path: |
            fuzz-keep/
            fuzz-python.txt
            fuzz-cpp.txt
          if-no-files-found: warn
          retention-days: 30

  engine-fuzz:
    # tests/tools/engine_fuzz.py: coal-cpp and the Python engine on the same random inputs, bytes compared.
    # Linux and macOS; the generator is not verified on Windows (its CRLF / Unicode-ID cases depend on the console
    # encoding there), so Windows is left to ci.yml's C++ job.
    name: "coal-cpp vs Python engine generator on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install COAL
        run: python -m pip install -e .
      - name: Build coal-cpp
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release -j 2
          test -x build/coal-cpp
      - name: Engine generator (1,500 cases)
        shell: bash
        env:
          COAL_CPP_BIN: build/coal-cpp
          MATRIX_OS: ${{ matrix.os }}
        run: |
          python tests/tools/engine_fuzz.py --n 1500 --seed "$FUZZ_SEED" --keep engine-fuzz-keep 2>&1 | tee engine-fuzz.txt
          status=${PIPESTATUS[0]}
          echo "### Engine generator on $MATRIX_OS, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^engine fuzz" engine-fuzz.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
      - name: Upload the differing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: engine-fuzz-${{ matrix.os }}-seed-${{ env.FUZZ_SEED }}
          path: |
            engine-fuzz-keep/
            engine-fuzz.txt
          if-no-files-found: warn
          retention-days: 30

  kaks-properties:
    # tests/test_kaks_properties.py with tonight's seed: the unit tests with COAL_SLOW=1 (1,500 pairs of up to 2,000
    # codons), then the script's campaign (1,500 more pairs: properties, swap and permutation invariance, both
    # output formats, the Python command, determinism). A finding that is not a known bug (KNOWN in the file) fails;
    # the shrunk cases are uploaded.
    name: "Ka/Ks property fuzz (coal-cpp)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install COAL
        run: python -m pip install -e .
      - name: Build coal-cpp
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release -j 2
          test -x build/coal-cpp
      - name: Ka/Ks properties (COAL_SLOW unit tests and a 1,500-pair campaign)
        shell: bash
        env:
          COAL_CPP_BIN: build/coal-cpp
          COAL_REQUIRE_CPP: "1"
          COAL_SLOW: "1"
        run: |
          status=0
          KAKS_FUZZ_SEED="$FUZZ_SEED" python -m unittest -v tests.test_kaks_properties > kaks-props.txt 2>&1 || status=$?
          python tests/test_kaks_properties.py --n 1500 --seed "$FUZZ_SEED" --keep kaks-props-keep \
            >> kaks-props.txt 2>&1 || status=$?
          cat kaks-props.txt
          echo "### Ka/Ks properties, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^kaks properties|^Ran |^OK|^FAILED" kaks-props.txt >> "$GITHUB_STEP_SUMMARY" || true
          test "$status" -eq 0
      - name: Upload the findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kaks-properties-seed-${{ env.FUZZ_SEED }}
          path: |
            kaks-props-keep/
            kaks-props.txt
          if-no-files-found: warn
          retention-days: 30

  sanitizers:
    # coal-cpp under AddressSanitizer (leaks included) and UndefinedBehaviorSanitizer: ci.yml's C++ test set plus
    # the stdin, robustness, error-precedence and batch tests, then 300 generator cases. Any sanitizer report in
    # the captured stderr fails the job, whatever the tests said. Peak-memory tests are skipped
    # (COAL_SKIP_MEMORY_TESTS: ASan's shadow memory makes them meaningless); "not built" skips still fail.
    name: "coal-cpp under ASan + UBSan"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      COAL_SKIP_MEMORY_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Install COAL
        run: python -m pip install -e .
      - name: Build coal-cpp with sanitizers
        shell: bash
        run: |
          # Debug adds only -g, so the -O1 here is the optimisation level that applies (Release's -O3 would win).
          # COAL_TEST_HOOKS=ON: the tests below pause and kill runs through the test hooks (docs/development.md)
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCOAL_WARNINGS_AS_ERRORS=ON -DCOAL_TEST_HOOKS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j 2
          test -x build-asan/coal-cpp
          echo "COAL_CPP_BIN=$PWD/build-asan/coal-cpp" >> "$GITHUB_ENV"
      - name: C++ tests under the sanitizers
        shell: bash
        env:
          COAL_IMPL: cpp
        run: |
          python -m unittest -v tests.test_differential tests.test_cpp_vs_python tests.test_cpp_cli \
            tests.test_cpp_readers tests.test_cpp_tables tests.test_cpp_pool \
            tests.test_stdin tests.test_robustness tests.test_cpp_error_precedence tests.test_batch \
            tests.test_kaks tests.test_kaks_comeron_li tests.test_align tests.test_msa tests.test_dnds_pipeline \
            tests.test_short_options tests.test_output_lock \
            tests.test_pair_table tests.test_kaks_cli_inputs tests.test_kaks_yn_shortcut tests.test_dnds_flags \
            tests.test_pipeline_order tests.test_pipeline_robustness tests.test_pipeline_provenance \
            tests.test_pipeline_isoforms tests.test_pipeline_atomic tests.test_citations tests.test_cli_commands tests.test_examples \
            tests.test_retest2_findings tests.test_cleanup1_findings tests.test_kaks_properties \
            tests.test_kaks_myn_kappa_inf \
            2>&1 | tee san-tests.txt
          status=${PIPESTATUS[0]}
          if grep -qE "AddressSanitizer|LeakSanitizer|runtime error" san-tests.txt; then
            echo "::error::a sanitizer reported during the C++ tests (see san-tests.txt)"; exit 1
          fi
          test "$status" -eq 0
          if grep -iE "\.\.\. skipped" san-tests.txt | grep -qi "not built"; then
            echo "::error::C++ tests were skipped as 'not built', so the sanitizer build was not exercised"; exit 1
          fi
      - name: Engine generator under the sanitizers (300 cases)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python tests/tools/engine_fuzz.py --n 300 --seed "$FUZZ_SEED" --sanitizer --keep san-keep 2>&1 | tee san-fuzz.txt
          status=${PIPESTATUS[0]}
          echo "### Sanitizer generator run, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^engine fuzz" san-fuzz.txt >> "$GITHUB_STEP_SUMMARY" || true
          if grep -qE "AddressSanitizer|LeakSanitizer|runtime error" san-fuzz.txt; then
            echo "::error::a sanitizer reported during the generator run (see san-fuzz.txt)"; exit 1
          fi
          test "$status" -eq 0
      - name: Ka/Ks property harness under the sanitizers (300 pairs)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python tests/test_kaks_properties.py --cpp build-asan/coal-cpp --n 300 --seed "$FUZZ_SEED" --max-codons 1000 \
            --keep san-kaks-keep 2>&1 | tee san-kaks.txt
          status=${PIPESTATUS[0]}
          echo "### Ka/Ks properties under the sanitizers, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^kaks properties" san-kaks.txt >> "$GITHUB_STEP_SUMMARY" || true
          if grep -qE "AddressSanitizer|LeakSanitizer|runtime error" san-kaks.txt; then
            echo "::error::a sanitizer reported during the Ka/Ks property run (see san-kaks.txt)"; exit 1
          fi
          test "$status" -eq 0
      - name: Upload the sanitizer reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sanitizers-seed-${{ env.FUZZ_SEED }}
          path: |
            san-keep/
            san-kaks-keep/
            san-tests.txt
            san-fuzz.txt
            san-kaks.txt
          if-no-files-found: warn
          retention-days: 30

  tsan:
    # coal-cpp and coal-cpp-align under ThreadSanitizer (tests/tools/tsan_threads.py): `coal-cpp kaks`, `dnds` and
    # `codon-dnds` with -j 4 for all nine methods (Comeron and Li included) in the default and the reference
    # flavours, and the aligner with -j 4. A ThreadSanitizer report fails the job, and so does an output that
    # differs from the same command's with -j 1. Tonight's seed draws the random pairs.
    name: "coal-cpp kaks / dnds / align -j 4 under ThreadSanitizer"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSAN_OPTIONS: exitcode=66:halt_on_error=0:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Build coal-cpp and coal-cpp-align with ThreadSanitizer
        shell: bash
        run: |
          # ThreadSanitizer maps its shadow memory at fixed addresses; the runner's kernel randomises more address
          # bits than older TSan runtimes accept ("unexpected memory mapping"): fewer bits for this job
          sudo sysctl vm.mmap_rnd_bits=28 || true
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOAL_WARNINGS_AS_ERRORS=ON -DCOAL_BUILD_TOOLS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan -j 2
          test -x build-tsan/coal-cpp
          test -x build-tsan/coal-cpp-align
          build-tsan/coal-cpp --version
      - name: Threaded commands under ThreadSanitizer
        shell: bash
        run: |
          python tests/tools/tsan_threads.py --build build-tsan --seed "$FUZZ_SEED" --jobs 4 --keep tsan-keep 2>&1 | tee tsan.txt
          status=${PIPESTATUS[0]}
          echo "### ThreadSanitizer, seed $FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(tsan threads|FAIL )" tsan.txt >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q "ThreadSanitizer" tsan.txt; then
            echo "::error::ThreadSanitizer reported (see tsan.txt)"; exit 1
          fi
          test "$status" -eq 0
          grep -q "^tsan threads: .* 0 failed" tsan.txt || { echo "::error::the ThreadSanitizer run did not finish"; exit 1; }
      - name: Upload the ThreadSanitizer reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tsan-seed-${{ env.FUZZ_SEED }}
          path: |
            tsan-keep/
            tsan.txt
          if-no-files-found: warn
          retention-days: 30

  tutorials:
    # ci.yml's tutorials job (scripts/run_tutorials.py: the commands of docs/tutorials/01, 02, 03 and 05 on their real
    # NCBI data, compared with what the tutorials show), every night and without its paths filter, so drift that does
    # not come from a change under docs/tutorials/, src/coal/ or cpp/ is caught too: a new DIAMOND / Clustal Omega /
    # MAFFT pin, NCBI's files or their availability. With --full (tutorial 3's MAFFT run, as ci.yml). The data and
    # COAL's tool cache are cached as in ci.yml. The seed is not used: the tutorials are deterministic.
    name: "Tutorials as tests (docs/tutorials on real data, nightly)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/coal-app/pyproject.toml
            apps/coal-app/desktop/requirements.txt
      - name: Cache the tutorial data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tutorial-data
          key: tutorial-data-${{ hashFiles('docs/tutorials/data/*.sh') }}
      - name: Cache COAL's tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/coal
          key: coal-tools-${{ runner.os }}-${{ hashFiles('src/coal/msa.py', 'src/coal/dnds_pipeline.py') }}
      - name: Install the engine, build coal-cpp and coal-cpp-align
        shell: bash
        run: |
          python -m pip install -e .
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target coal-cpp coal-cpp-align
          echo "COAL_CPP=$PWD/build/coal-cpp" >> "$GITHUB_ENV"
      - name: Install DIAMOND, Clustal Omega, MAFFT and PAL2NAL v14
        timeout-minutes: 10
        shell: bash
        run: |
          python -m coal pipeline install diamond clustalo mafft
          d=$(python -c "from coal import msa; import os; print(os.path.dirname(msa.find_clustalo()))")
          echo "$d" >> "$GITHUB_PATH"
          python scripts/fetch_pal2nal.py
          echo "PAL2NAL=$PWD/PAL2NAL/pal2nal.v14/pal2nal.pl" >> "$GITHUB_ENV"
      - name: Download the tutorial data (NCBI, SHA-256 checked)
        timeout-minutes: 5
        shell: bash
        run: |
          for s in mycoplasma enterobacteria chlamydia; do
            for attempt in 1 2 3; do
              bash docs/tutorials/data/get_$s.sh tutorial-data && break
              [ "$attempt" = 3 ] && { echo "::error::could not download the data of get_$s.sh from NCBI"; exit 1; }
              echo "attempt $attempt failed; retrying in 30 s"; sleep 30
            done
          done
      - name: Run the tutorials and compare with what they show
        shell: bash
        run: |
          coal --cpp-path
          python scripts/run_tutorials.py --full --data-cache tutorial-data --jobs 4 --workdir "$RUNNER_TEMP/tutorials" \
            --report "$RUNNER_TEMP/tutorials/report.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tutorials-nightly
          path: |
            ${{ runner.temp }}/tutorials/report.json
            ${{ runner.temp }}/tutorials/logs
          if-no-files-found: ignore
          retention-days: 30
