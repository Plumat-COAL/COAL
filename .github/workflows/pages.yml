# Website: deploy site/ to GitHub Pages (https://plumat-coal.github.io/COAL/) on every push to main that touches it.
# Needs Settings > Pages > Source: "GitHub Actions" (once). See site/README.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
      - "tests_app/test_site.py"
  # The site's download buttons depend on a published release, so the site is also rebuilt when one is published
  # (otherwise a release published after the last push to main would leave "first release coming soon" in place).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and package site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Site tests (links, no external URLs, download names match the release workflow)
        env:
          COAL_REQUIRE_EXTRAS: gui   # makes a missing PyYAML fail instead of skip
        run: |
          python -m pip install pyyaml==6.0.2
          python -m unittest tests_app/test_site.py -v
      - name: Assemble (the site's own files only)
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -f _site/README.md
          ls -lR _site
      # Without a release every releases/latest/download/... button would give a 404, so when no published release
      # exists the deployed copy says "First release coming soon" and installs from source.
      - name: Download buttons only when a release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest release must hold the installer, not merely exist: a release published with no files (failed
          # build) would keep the buttons and every download would give a 404.
          if gh release view --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -qx "COAL-Setup-windows-x64.exe"; then
            echo "The latest release has its files: download buttons kept."
          else
            echo "::warning::No release with files yet: download buttons replaced by the install-from-source notice."
            # Every page; pages without download links are left as they are
            python scripts/site_without_release.py _site/*.html
          fi
      # The site is built from main, but its buttons give the latest release: show that release's
      # version and drop text about features it does not have yet (data-since). Rollback: delete this step.
      - name: Match the site to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$tag" ]; then
            python scripts/site_for_release.py "${tag#v}" _site/*.html
          else
            echo "No published release: site left at main's version."
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the Pages site
      id-token: write   # required by deploy-pages to verify where the artifact came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
