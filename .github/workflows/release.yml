# Release: on a pushed tag v* (or by hand), build the Python wheels + sdists of both packages (the engine coal-align
# from the repository root, the app coal-align-app from apps/coal-app), the engine's platform wheels with coal-cpp
# inside (Linux x86_64/aarch64, macOS, Windows) and the Windows app (installer + portable zip), check them, and
# publish a GitHub Release with every file, version-free copies and SHA256SUMS.txt.
# The website (site/) links to https://github.com/plumat-coal/COAL/releases/latest/download/<version-free name>,
# so a new release updates the download buttons without editing the site. See site/README.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.3.0"
        required: true
        type: string
      publish:
        description: "Create/update the GitHub Release (off = build and check only; files stay as workflow artifacts)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  python:
    name: Python wheels and sdists (engine and app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the version in the source
        id: v
        run: python scripts/release_version.py "$TAG" --github-output
      - name: Build wheels and sdists
        run: |
          python -m pip install build==1.2.2.post1
          python -m build --outdir dist .
          python -m build --outdir dist apps/coal-app
          ls -l dist
      - name: Check the wheels and the version-free sdists install and run
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p release
          cp "dist/coal_align-${V}-py3-none-any.whl" "dist/coal_align-${V}.tar.gz" release/
          cp "dist/coal_align_app-${V}-py3-none-any.whl" "dist/coal_align_app-${V}.tar.gz" release/
          # Version-free sdist copies, for
          #   pip install "coal-align @ .../releases/latest/download/coal_src.tar.gz"                       (engine)
          #   pip install "coal-align @ .../coal_src.tar.gz" "coal-align-app[gui] @ .../coal_app_src.tar.gz"  (app)
          # No hyphen in the names on purpose: pip caches wheels built from "name-version"-looking archive URLs, so
          # "coal_align-latest.tar.gz" would keep installing the old build after a new release (tested with pip 24.0).
          cp "dist/coal_align-${V}.tar.gz" release/coal_src.tar.gz
          cp "dist/coal_align_app-${V}.tar.gz" release/coal_app_src.tar.gz
          # the engine wheel alone: `coal` works, and no app comes with it
          python -m venv "$RUNNER_TEMP/whl"
          "$RUNNER_TEMP/whl/bin/python" -m pip install "release/coal_align-${V}-py3-none-any.whl"
          test "$("$RUNNER_TEMP/whl/bin/coal" --version)" = "coal ${V}"
          "$RUNNER_TEMP/whl/bin/coal" examples/clean/protein.aln.fasta examples/clean/dna.fasta -o "$RUNNER_TEMP/whl.fa"
          PYTHONPATH=src python -m coal examples/clean/protein.aln.fasta examples/clean/dna.fasta -o "$RUNNER_TEMP/ref.fa"
          cmp "$RUNNER_TEMP/whl.fa" "$RUNNER_TEMP/ref.fa"
          if "$RUNNER_TEMP/whl/bin/python" -c "import coal_app" 2> /dev/null; then
            echo "::error::the coal-align wheel installs coal_app"; exit 1
          fi
          # then the app wheel on top (no extras): it finds the engine and the examples
          "$RUNNER_TEMP/whl/bin/python" -m pip install "release/coal_align_app-${V}-py3-none-any.whl"
          "$RUNNER_TEMP/whl/bin/coal-gui" --help > /dev/null
          "$RUNNER_TEMP/whl/bin/python" -m coal_app --check | tee "$RUNNER_TEMP/check.txt"
          grep -q "^coal ${V}:" "$RUNNER_TEMP/check.txt"
          grep -q "examples: clean, mito, messy_ids, one_broken_gene" "$RUNNER_TEMP/check.txt"
          # the version-free sdists, as the website's pip commands install them
          python -m venv "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/src/bin/python" -m pip install "coal-align @ file://$PWD/release/coal_src.tar.gz"
          test "$("$RUNNER_TEMP/src/bin/coal" --version)" = "coal ${V}"
          "$RUNNER_TEMP/src/bin/python" -m pip install "coal-align @ file://$PWD/release/coal_src.tar.gz" \
            "coal-align-app @ file://$PWD/release/coal_app_src.tar.gz"
          "$RUNNER_TEMP/src/bin/python" -m coal_app --check
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-python
          path: release/
          if-no-files-found: error

  # Platform wheels of the engine: the pure wheel from the python job plus coal-cpp built for that platform, so
  # `pip install coal-align` gives both engines on Linux x86_64 / aarch64 (glibc 2.28+), macOS 11+ (one universal2
  # wheel) and Windows x64; pip falls back to the py3-none-any wheel or the sdist elsewhere. packaging/wheels/
  # has the scripts; docs/cpp-engine.md "Where coal looks for coal-cpp" the lookup order. Linux builds in the
  # manylinux_2_28 containers with libstdc++/libgcc static and auditwheel checks the tag; aarch64 runs on GitHub's
  # native arm runner (free for public repositories; the QEMU alternative is docker/setup-qemu-action plus
  # `docker run --platform linux/arm64`, several times slower).
  cpp-wheels:
    name: Engine wheel with coal-cpp (${{ matrix.tag }})
    needs: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: manylinux_2_28_x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            tag: manylinux_2_28_aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-latest
            tag: macosx_11_0_universal2
          - os: windows-latest
            tag: win_amd64
    defaults:
      run:
        shell: bash
    env:
      V: ${{ needs.python.outputs.version }}
      TAG_NAME: ${{ matrix.tag }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-python
          path: release/
      - name: Build coal-cpp (Linux, inside the manylinux_2_28 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io "$IMAGE" bash packaging/wheels/build_linux_binary.sh /io /io/build-wheel
          sudo chown -R "$(id -u):$(id -g)" build-wheel
          echo "BIN=build-wheel/coal-cpp" >> "$GITHUB_ENV"
      - name: Build coal-cpp (macOS, universal2)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-wheel -DCMAKE_BUILD_TYPE=Release -DCOAL_WARNINGS_AS_ERRORS=ON -DCOAL_BUILD_TOOLS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-wheel -j 3
          archs=$(lipo -archs build-wheel/coal-cpp)
          echo "architectures: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1;; esac
          otool -L build-wheel/coal-cpp
          if otool -L build-wheel/coal-cpp | tail -n +2 | grep -v "/usr/lib/"; then
            echo "::error::coal-cpp links libraries outside /usr/lib"; exit 1
          fi
          echo "BIN=build-wheel/coal-cpp" >> "$GITHUB_ENV"
      - name: Build coal-cpp (Windows, static CRT)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-wheel -A x64 -DCOAL_WARNINGS_AS_ERRORS=ON -DCOAL_BUILD_TOOLS=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build-wheel --config Release -j 2
          test -f build-wheel/Release/coal-cpp.exe
          echo "BIN=build-wheel/Release/coal-cpp.exe" >> "$GITHUB_ENV"
      - name: Make the platform wheel
        run: |
          python -m pip install wheel==0.45.1
          audit=()
          if [ "$RUNNER_OS" = Linux ]; then python -m pip install auditwheel==6.4.2; audit=(--audit); fi
          "$BIN" --version
          python packaging/wheels/build_platform_wheel.py --binary "$BIN" \
            --wheel "release/coal_align-${V}-py3-none-any.whl" --platform-tag "$TAG_NAME" --outdir wheelhouse "${audit[@]}"
          ls -l wheelhouse
          test -s "wheelhouse/coal_align-${V}-py3-none-${TAG_NAME}.whl"
      - name: The wheel installs and `coal` uses its coal-cpp
        run: |
          python -m venv "$RUNNER_TEMP/pw"
          if [ -d "$RUNNER_TEMP/pw/Scripts" ]; then b="$RUNNER_TEMP/pw/Scripts"; else b="$RUNNER_TEMP/pw/bin"; fi
          "$b/python" -m pip install "wheelhouse/coal_align-${V}-py3-none-${TAG_NAME}.whl"
          test "$("$b/coal" --version)" = "coal ${V}"
          cpp=$("$b/coal" --cpp-path)
          echo "coal-cpp: $cpp"
          case "$cpp" in *site-packages*coal*bin*coal-cpp*) ;; *) echo "::error::coal --cpp-path is not the bundled binary"; exit 1;; esac
          test "$("$cpp" --version | cut -d' ' -f1,2)" = "coal ${V}"
          COAL_ENGINE=cpp "$b/coal" examples/clean/protein.aln.fasta examples/clean/dna.fasta -o "$RUNNER_TEMP/cpp.fa"
          COAL_ENGINE=python "$b/coal" examples/clean/protein.aln.fasta examples/clean/dna.fasta -o "$RUNNER_TEMP/py.fa"
          cmp "$RUNNER_TEMP/cpp.fa" "$RUNNER_TEMP/py.fa"
          echo "bundled coal-cpp output is byte-identical to the Python engine's"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheel-${{ matrix.tag }}
          path: wheelhouse/
          if-no-files-found: error

  windows:
    name: Windows app (installer + portable zip)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the version in the source
        id: v
        run: python scripts/release_version.py $env:TAG --github-output
      - name: Install Inno Setup (pinned)
        run: |
          # 6.7.1 is the newest approved Chocolatey InnoSetup package (6.3+ is required by desktop/installer.iss).
          choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup installed, but $iscc is missing" }
      - name: Build the C++ engine (bundled into the app; SHIP-19)
        run: |
          # build-app, not build/ or cpp/build: the tests in build.ps1 look in those (demo/race.py picked a .lib there)
          cmake -S . -B build-app -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build-app --config Release -j 2
          if (-not (Test-Path build-app\Release\coal-cpp.exe)) { throw "no build-app\Release\coal-cpp.exe" }
      - name: Create the build venv with this Python (build.ps1 reuses it)
        run: python -m venv apps\coal-app\desktop\.venv
      - name: Build (apps\coal-app\desktop\build.ps1 - tests, PyInstaller, frozen --version and smoke test, installer)
        timeout-minutes: 75
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\coal-app\desktop\build.ps1
      - name: Smoke run - frozen engine output equals the Python engine's
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "apps\coal-app\desktop\dist\COAL\COAL.exe"
          $py = "apps\coal-app\desktop\.venv\Scripts\python.exe"
          $prot = "examples\clean\protein.aln.fasta"
          $dna = "examples\clean\dna.fasta"
          $frozen = Join-Path $env:RUNNER_TEMP "smoke_frozen.fasta"
          $ref = Join-Path $env:RUNNER_TEMP "smoke_python.fasta"
          $out = Join-Path $env:RUNNER_TEMP "smoke_frozen.out"
          $err = Join-Path $env:RUNNER_TEMP "smoke_frozen.err"
          # A windowed exe has no console: capture its output through files, with a timeout.
          function Invoke-Frozen([string[]]$ArgList) {
            $p = Start-Process -FilePath $exe -ArgumentList $ArgList -NoNewWindow -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { & taskkill.exe /T /F /PID $p.Id; throw "COAL.exe $ArgList timed out" }
            $p.WaitForExit()
            $text = [string](Get-Content -Raw $out) + [string](Get-Content -Raw $err)
            if ($p.ExitCode -ne 0) { throw "COAL.exe $ArgList exited $($p.ExitCode): $text" }
            return $text
          }
          $v = Invoke-Frozen @("-m", "coal", "--version")
          if ($v.Trim() -ne "coal $env:VERSION") { throw "COAL.exe -m coal --version printed '$($v.Trim())'" }
          Write-Host "frozen engine: $($v.Trim())"
          $null = Invoke-Frozen @("-m", "coal", $prot, $dna, "-o", $frozen)
          & $py -m coal $prot $dna -o $ref
          if ($LASTEXITCODE -ne 0) { throw "python -m coal failed ($LASTEXITCODE)" }
          if ((Get-FileHash $frozen).Hash -ne (Get-FileHash $ref).Hash) { throw "frozen and Python outputs differ" }
          Write-Host "frozen engine output is byte-identical to python -m coal on examples\clean"
        env:
          VERSION: ${{ steps.v.outputs.version }}
      - name: Collect the installer and the portable zip (versioned and version-free names)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:VERSION
          $setup = "apps\coal-app\desktop\dist\COAL-Setup-$v.exe"
          if (-not (Test-Path $setup)) { throw "build.ps1 made no installer ($setup): was Inno Setup found?" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup "release\COAL-Setup-$v.exe"
          Copy-Item $setup "release\COAL-Setup-windows-x64.exe"
          Compress-Archive -Path "apps\coal-app\desktop\dist\COAL" -DestinationPath "release\COAL-$v-windows-x64.zip"
          Copy-Item "release\COAL-$v-windows-x64.zip" "release\COAL-windows-x64.zip"
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-windows
          path: release/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [python, cpp-wheels, windows]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and upload its files; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: SHA-256 of every file
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Check the release files
        # The website links to the version-free names below; tests/test_docs_site.py checks it against this list.
        env:
          V: ${{ needs.python.outputs.version }}
        run: |
          expected=(
            "COAL-Setup-${V}.exe"
            "COAL-Setup-windows-x64.exe"
            "COAL-${V}-windows-x64.zip"
            "COAL-windows-x64.zip"
            "coal_align-${V}-py3-none-any.whl"
            "coal_align-${V}-py3-none-manylinux_2_28_x86_64.whl"
            "coal_align-${V}-py3-none-manylinux_2_28_aarch64.whl"
            "coal_align-${V}-py3-none-macosx_11_0_universal2.whl"
            "coal_align-${V}-py3-none-win_amd64.whl"
            "coal_align-${V}.tar.gz"
            "coal_src.tar.gz"
            "coal_align_app-${V}-py3-none-any.whl"
            "coal_align_app-${V}.tar.gz"
            "coal_app_src.tar.gz"
            "SHA256SUMS.txt"
          )
          for f in "${expected[@]}"; do test -s "release/$f" || { echo "::error::missing release file $f"; exit 1; }; done
          test "$(ls release | wc -l)" -eq "${#expected[@]}" || { echo "::error::unexpected files: $(ls release)"; exit 1; }
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.python.outputs.version }}
          PRE: ${{ needs.python.outputs.prerelease }}
        run: |
          set +e
          python3 scripts/release_notes.py "$V" notes.md
          rc=$?
          set -e
          extra=()
          if [ "$rc" -eq 3 ]; then extra+=(--generate-notes); elif [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ "$PRE" = "true" ]; then extra+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "COAL $V" --notes-file notes.md
          else
            gh release create "$TAG" release/* --verify-tag --title "COAL $V" --notes-file notes.md "${extra[@]}"
          fi

  # PyPI, by trusted publishing (no API token in the repository). Off until the repository variable PYPI_PUBLISH is
  # "true": set it (Settings > Secrets and variables > Actions > Variables) after creating the two projects on PyPI
  # with a trusted publisher for this repository, workflow release.yml, environment pypi (docs/development.md).
  pypi:
    name: Publish to PyPI (coal-align, coal-align-app)
    needs: [python, cpp-wheels, release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*   # dist-python and dist-wheel-<tag>; dist-windows comes along and is left alone
          merge-multiple: true
          path: release/
      - name: Only the versioned wheels and sdists (not the version-free copies or checksums)
        # The engine's platform wheels (coal-cpp inside) and its pure wheel (the fallback) go up together, so pip
        # picks the platform wheel where there is one and the pure wheel or the sdist elsewhere.
        env:
          V: ${{ needs.python.outputs.version }}
        run: |
          mkdir -p dist
          cp release/coal_align-${V}-py3-none-*.whl "release/coal_align-${V}.tar.gz" \
             "release/coal_align_app-${V}-py3-none-any.whl" "release/coal_align_app-${V}.tar.gz" dist/
          test -s "dist/coal_align-${V}-py3-none-any.whl"
          test "$(ls dist/coal_align-${V}-py3-none-*.whl | wc -l)" -eq 5
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          packages-dir: dist/
          print-hash: true
