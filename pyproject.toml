[build-system]
# 77.0.3+: the SPDX licence expression and license-files of PEP 639 (project.license as a table and the licence
# classifier are deprecated: setuptools removes them in 2027); also 69.3+: normalised sdist name (coal_align-<v>.tar.gz).
# setuptools 77 needs Python 3.9, below this project's floor of 3.10.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-align"
version = "0.6.0.dev0"
description = "Fast codon alignments (PAL2NAL alternative), Ka/Ks (dN/dS) for pairs, and a one-step pipeline from coding sequences to dN/dS"
readme = "README.md"
license = "GPL-3.0-only"  # from the release after 0.5.0; 0.5.0 and earlier are MIT (CHANGELOG.md)
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fast = ["numpy"]   # optional: speeds up the codon check on large inputs (BSD licence)
# The web GUI, the MCP server and the Windows app are a separate distribution, coal-align-app (apps/coal-app/),
# so pipelines that install coal-align get the engine only: no dependencies and no app code.

[project.scripts]
coal = "coal.cli:main"
pal2nal = "coal_compat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: the package has inline type hints (docs/python-api.md names the typed public functions)
[tool.setuptools.package-data]
coal = ["py.typed"]

# Example inputs (also used by the engine tests and shown in the docs as `coal examples/...`), installed under
# <prefix>/share/coal/examples. The app (coal-align-app, which depends on this package) looks there after
# COAL_EXAMPLES_DIR and a repo checkout.
[tool.setuptools.data-files]
"share/coal/examples/clean" = ["examples/clean/README.md", "examples/clean/dna.fasta", "examples/clean/protein.aln.fasta"]
"share/coal/examples/mito" = ["examples/mito/README.md", "examples/mito/dna.fasta", "examples/mito/protein.aln.fasta"]
"share/coal/examples/messy_ids" = ["examples/messy_ids/README.md", "examples/messy_ids/dna.fasta", "examples/messy_ids/protein.aln.fasta"]
"share/coal/examples/one_broken_gene" = ["examples/one_broken_gene/README.md", "examples/one_broken_gene/dna.fasta", "examples/one_broken_gene/protein.aln.fasta"]
"share/coal/examples/dnds" = ["examples/dnds/README.md", "examples/dnds/species_a_cds.fasta", "examples/dnds/species_b_cds.fasta", "examples/dnds/orthologs.tsv", "examples/dnds/codon.fasta"]
