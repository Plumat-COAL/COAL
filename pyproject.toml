[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coal"
version = "0.3.0"
description = "Fast codon alignment from a protein alignment and coding DNA (PAL2NAL alternative)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fast = ["numpy"]   # optional: speeds up the codon check on large inputs (BSD licence)
# Web GUI + MCP server for AI agents (python -m coal_app / coal-gui). Pinned exactly.
# NOTE: pin not verified against PyPI (no PyPI access when written); see overnight/app/LOG.md.
gui = ["gradio[mcp]==5.49.1"]
# Stand-alone stdio MCP server (python -m coal_app --mcp), no Gradio needed.
mcp = ["mcp==2.2.0"]

[project.scripts]
coal = "coal.cli:main"
coal-gui = "coal_app.__main__:main"
pal2nal = "coal_compat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coal_app = ["*.json"]
