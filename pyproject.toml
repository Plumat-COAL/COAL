[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coal"
version = "0.2.0"
description = "Fast codon alignment from a protein alignment and coding DNA (PAL2NAL alternative)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coal = "coal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
